<title>暖暖小舖</title>
<!--
  網頁版外殼（Godot 的 custom HTML shell）。
  Godot 匯出時會替換 $GODOT_ 開頭的佔位字串。
  tools/build_web.py 會把這個檔案做成兩種版本：
    builds/web/       一般網頁版（可上傳 itch.io 等平台）
    builds/artifact/  wasm／pck 以 gzip 壓縮，靠下方 GZ_ASSETS 在瀏覽器解壓
  這裡刻意不寫 <html>/<head>/<body>（HTML5 允許省略），兩種版本可以共用。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>
/* 版面：整頁就是遊戲畫布；載入時中間一張和遊戲 UI 一樣的「紙卡」。單一配色，跟遊戲內一致。 */
:root {
	--paper: #fff8e8;
	--paper-edge: #e0c29e;
	--ink: #5c4536;
	--ink-soft: #8a7564;
	--ground: #f5e8d1;
	--mint: #b8e6c9;
	--mint-edge: #73b38c;
	--blush: #f8b8c4;
	--warn: #d9614f;
	--font-ui: "Huninn", "jf open 粉圓", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
	color-scheme: light;
}
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--ground);
	color: var(--ink);
	font-family: var(--font-ui);
	overflow: hidden;
	touch-action: none;
}
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }

#status {
	position: fixed;
	inset: 0;
	display: grid;
	place-items: center;
	padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
	background:
		radial-gradient(circle at 20% 15%, #fff3dc 0 18%, transparent 19%),
		radial-gradient(circle at 85% 80%, #f1dfc2 0 22%, transparent 23%),
		var(--ground);
	z-index: 2;
}
.card {
	width: min(360px, 100%);
	box-sizing: border-box;
	padding: 28px 28px 22px;
	background: var(--paper);
	border: 3px solid var(--paper-edge);
	border-radius: 22px;
	box-shadow: 0 4px 0 rgba(92, 69, 54, 0.12);
	text-align: center;
	display: grid;
	gap: 14px;
}
.shop { width: 92px; height: 92px; margin: 0 auto; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-1.5deg); } }
h1 { margin: 0; font-size: 28px; font-weight: 400; letter-spacing: 0.08em; text-wrap: balance; }
.sub { margin: -8px 0 0; font-size: 14px; color: var(--ink-soft); letter-spacing: 0.04em; }
.bar {
	height: 16px;
	border-radius: 10px;
	border: 3px solid var(--paper-edge);
	background: #f0e2cc;
	overflow: hidden;
}
.bar > i {
	display: block;
	height: 100%;
	width: 0%;
	background: var(--mint);
	border-right: 3px solid var(--mint-edge);
	border-radius: 0 8px 8px 0;
	transition: width 0.25s ease;
}
.bar.indeterminate > i { width: 35%; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
#status-text { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
#status-notice { display: none; margin: 0; padding: 12px; border-radius: 12px; border: 2px solid var(--warn); color: var(--warn); font-size: 14px; line-height: 1.6; text-align: left; white-space: pre-line; }
#status.failed .bar, #status.failed #status-text { display: none; }
#status.failed #status-notice { display: block; }
@media (prefers-reduced-motion: reduce) {
	.shop, .bar.indeterminate > i { animation: none; }
}
</style>

<canvas id="canvas">你的瀏覽器不支援 canvas。</canvas>
<noscript>需要開啟 JavaScript 才能遊玩。</noscript>

<div id="status" role="status" aria-live="polite">
	<div class="card">
		<svg class="shop" viewBox="0 0 128 128" aria-hidden="true">
			<rect x="20" y="52" width="88" height="56" rx="8" fill="#fff6e6" stroke="#5c4536" stroke-width="5"/>
			<path d="M14 52 L24 26 H104 L114 52 Z" fill="#f8b8c4" stroke="#5c4536" stroke-width="5" stroke-linejoin="round"/>
			<path d="M36 26 L32 52 M56 26 L54 52 M72 26 L74 52 M92 26 L96 52" stroke="#fff6e6" stroke-width="6"/>
			<rect x="54" y="72" width="22" height="36" rx="4" fill="#bfe6cf" stroke="#5c4536" stroke-width="4"/>
			<rect x="30" y="66" width="16" height="16" rx="3" fill="#cfeaf5" stroke="#5c4536" stroke-width="4"/>
			<rect x="84" y="66" width="16" height="16" rx="3" fill="#cfeaf5" stroke="#5c4536" stroke-width="4"/>
			<circle cx="70" cy="91" r="2.5" fill="#5c4536"/>
		</svg>
		<h1>暖暖小舖</h1>
		<p class="sub">Cozy Corner Mart</p>
		<div class="bar indeterminate" id="bar"><i></i></div>
		<p id="status-text">正在打開店門…</p>
		<p id="status-notice"></p>
		<p class="hint">第一次載入約 15 MB，之後會快很多。<br>建議用電腦的鍵盤和滑鼠遊玩。</p>
	</div>
</div>

<script>
// 打包成 artifact 時，build_web.py 會在這裡填入「原檔名 → gzip 壓縮檔」的對照表。
// 瀏覽器抓這些檔案時改抓壓縮檔，再用內建的 DecompressionStream 解壓，所以單檔可以小於主機的上限。
const GZ_ASSETS = /*GZ_ASSETS*/{"index.pck": "index.pck.gz.wasm", "index.wasm": ["index.wasm.gz.0.wasm", "index.wasm.gz.1.wasm"]}/*END_GZ_ASSETS*/;
(function patchFetchForGzip() {
	if (Object.keys(GZ_ASSETS).length === 0) return;
	if (!('DecompressionStream' in window)) return;
	const realFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || String(input);
		const name = url.split('?')[0].split('/').pop();
		if (!Object.prototype.hasOwnProperty.call(GZ_ASSETS, name)) return realFetch(input, init);
		// 對照表的值可以是一個檔名，或是切成好幾段的檔名清單（依序接回來）
		const parts = [].concat(GZ_ASSETS[name]);
		const base = url.split('?')[0];
		return Promise.all(parts.map(function (p) { return realFetch(base.replace(/[^/]*$/, p), init); })).then(function (list) {
			const bad = list.find(function (r) { return !r.ok; });
			if (bad) return bad;
			const type = name.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
			const body = list.length === 1
				? Promise.resolve(list[0].body)
				: Promise.all(list.map(function (r) { return r.blob(); })).then(function (b) { return new Blob(b).stream(); });
			return body.then(function (stream) {
				return new Response(stream.pipeThrough(new DecompressionStream('gzip')), {
					status: 200,
					headers: { 'Content-Type': type },
				});
			});
		});
	};
}());
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3856676,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = bar.firstElementChild;
	const text = document.getElementById('status-text');
	const notice = document.getElementById('status-notice');

	function fail(err) {
		console.error(err);
		let msg = err instanceof Error ? err.message : String(err || '發生未知的錯誤。');
		notice.textContent = '店門卡住了，打不開…\n' + msg + '\n\n請改用最新版的 Chrome、Edge 或 Firefox 再試一次。';
		overlay.classList.add('failed');
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('瀏覽器缺少這些功能：\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.round(current / total * 100));
				bar.classList.remove('indeterminate');
				fill.style.width = pct + '%';
				text.textContent = pct < 100 ? '正在搬貨上架… ' + pct + '%' : '店員準備中…';
			}
		},
	}).then(function () {
		overlay.remove();
		document.getElementById('canvas').focus();
	}, fail);
}());
</script>
